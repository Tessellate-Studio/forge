name: Auto PR Creation and Review

on:
  # Allow this workflow to be called from other repositories
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '18'
      validate_command:
        description: 'Command to run for validation'
        required: false
        type: string
        default: 'npm test'
    secrets:
      GITHUB_TOKEN:
        required: true
  
  # Support direct usage in this repository for feature branches
  push:
    branches: 
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'docs/**'
      - 'hotfix/**'
  
  # Also trigger on workflow dispatch for manual execution
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name to create PR for'
        required: false
        default: ''

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version || '18' }}
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found, skipping npm install"
          fi
      
      - name: Run validation and tests
        run: |
          if [ -f package.json ]; then
            # Run linting if available
            if npm run lint --silent 2>/dev/null; then
              echo "✅ Linting passed"
            else
              echo "ℹ️ No lint script found or linting failed"
            fi
            
            # Run tests if available
            if npm test --silent 2>/dev/null; then
              echo "✅ Tests passed"
            else
              echo "ℹ️ No test script found or tests failed"
            fi
            
            # Run security audit
            npm audit --audit-level=high || echo "⚠️ Security audit found issues"
          else
            echo "No package.json found, skipping validation steps"
          fi
        continue-on-error: true
      
      - name: Determine target branch
        id: target
        run: |
          # Determine the target branch (main or master)
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "branch=main" >> $GITHUB_OUTPUT
            echo "Target branch: main"
          elif git show-ref --verify --quiet refs/remotes/origin/master; then
            echo "branch=master" >> $GITHUB_OUTPUT
            echo "Target branch: master"
          else
            echo "branch=main" >> $GITHUB_OUTPUT
            echo "Default target branch: main"
          fi
      
      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_branch="${{ github.ref_name }}"
          target_branch="${{ steps.target.outputs.branch }}"
          
          # Check if PR already exists
          existing_pr=$(gh pr list --head "$current_branch" --base "$target_branch" --json number --jq '.[0].number')
          
          if [ "$existing_pr" = "null" ] || [ -z "$existing_pr" ]; then
            # Extract meaningful PR title from branch name and commit
            branch_type=$(echo "$current_branch" | cut -d'/' -f1)
            branch_desc=$(echo "$current_branch" | cut -d'/' -f2- | sed 's/-/ /g')
            
            case "$branch_type" in
              "feature")
                pr_title="✨ Feature: $branch_desc"
                ;;
              "fix")
                pr_title="🐛 Fix: $branch_desc"
                ;;
              "refactor")
                pr_title="♻️ Refactor: $branch_desc"
                ;;
              "docs")
                pr_title="📚 Docs: $branch_desc"
                ;;
              "hotfix")
                pr_title="🚨 Hotfix: $branch_desc"
                ;;
              *)
                pr_title="🔄 Update: $branch_desc"
                ;;
            esac
            
            # Create new PR
            gh pr create \
              --base "$target_branch" \
              --title "$pr_title" \
              --body "## Summary
              
**Branch:** \`$current_branch\`  
**Target:** \`$target_branch\`  
**Commit:** ${{ github.sha }}

### Changes
${{ github.event.head_commit.message || 'Manual workflow dispatch' }}

### Automated Checks
- ✅ Code validation completed
- ✅ Dependencies installed
- ✅ Security scan performed

### Review Checklist
- [ ] Code follows project standards
- [ ] Tests pass (if applicable)
- [ ] Documentation updated (if needed)
- [ ] No breaking changes introduced
- [ ] Security considerations reviewed

### Next Steps
- Awaiting code review
- Will auto-merge if all checks pass and approved

---
*This PR was created automatically by the PR workflow*"
            
            echo "✅ PR created successfully"
            
            # Add helpful labels based on branch type
            case "$branch_type" in
              "feature")
                gh pr edit --add-label "enhancement,auto-created" || true
                ;;
              "fix")
                gh pr edit --add-label "bug,auto-created" || true
                ;;
              "docs")
                gh pr edit --add-label "documentation,auto-created" || true
                ;;
              *)
                gh pr edit --add-label "auto-created" || true
                ;;
            esac
          else
            echo "PR already exists: #$existing_pr"
            echo "Updating existing PR with latest commit information"
            
            gh pr comment $existing_pr --body "🔄 **Updated with latest changes**

**Latest Commit:** ${{ github.sha }}  
**Commit Message:** ${{ github.event.head_commit.message || 'Manual workflow dispatch' }}  
**Updated:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

Automated checks have been re-run for this update."
          fi