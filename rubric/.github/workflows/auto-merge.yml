name: Auto Merge Approved PRs

on:
  # Allow this workflow to be called from other repositories
  workflow_call:
    inputs:
      required_checks:
        description: 'Required status checks (comma-separated)'
        required: false
        type: string
        default: 'create-pr'
    secrets:
      GITHUB_TOKEN:
        required: true
  
  # Also support direct usage in this repository
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  status: {}

jobs:
  auto-merge:
    if: |
      github.event.review.state == 'approved' || 
      github.event.check_suite.conclusion == 'success' ||
      github.event.state == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check PR status and merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get PR number from event
          if [ "${{ github.event_name }}" = "pull_request_review" ]; then
            PR_NUMBER=${{ github.event.pull_request.number }}
            echo "PR from review event: #$PR_NUMBER"
          else
            # Find PR for this commit/check
            PR_NUMBER=$(gh pr list --search "${{ github.sha }}" --json number --jq '.[0].number' 2>/dev/null || echo "")
            
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
              # Try to find any open PR
              PR_NUMBER=$(gh pr list --json number --jq '.[0].number' 2>/dev/null || echo "")
            fi
          fi
          
          if [ "$PR_NUMBER" = "null" ] || [ -z "$PR_NUMBER" ]; then
            echo "No PR found for this event"
            exit 0
          fi
          
          echo "Checking PR #$PR_NUMBER"
          
          # Get PR details with error handling
          PR_DATA=$(gh pr view $PR_NUMBER --json state,mergeable,reviewDecision,statusCheckRollupState,headRefName,baseRefName 2>/dev/null || echo '{}')
          
          if [ "$PR_DATA" = "{}" ]; then
            echo "Failed to get PR data for #$PR_NUMBER"
            exit 1
          fi
          
          STATE=$(echo $PR_DATA | jq -r '.state // "UNKNOWN"')
          MERGEABLE=$(echo $PR_DATA | jq -r '.mergeable // "UNKNOWN"')
          REVIEW_DECISION=$(echo $PR_DATA | jq -r '.reviewDecision // "REVIEW_REQUIRED"')
          STATUS_CHECKS=$(echo $PR_DATA | jq -r '.statusCheckRollupState // "PENDING"')
          HEAD_BRANCH=$(echo $PR_DATA | jq -r '.headRefName // "unknown"')
          BASE_BRANCH=$(echo $PR_DATA | jq -r '.baseRefName // "unknown"')
          
          echo "PR Details:"
          echo "  State: $STATE"
          echo "  Mergeable: $MERGEABLE"
          echo "  Review Decision: $REVIEW_DECISION"
          echo "  Status Checks: $STATUS_CHECKS"
          echo "  From: $HEAD_BRANCH -> $BASE_BRANCH"
          
          # Enhanced conditions for auto-merge
          can_merge=false
          
          if [ "$STATE" = "OPEN" ] && [ "$MERGEABLE" = "MERGEABLE" ]; then
            # Check if either approved or no review required
            if [ "$REVIEW_DECISION" = "APPROVED" ] || [ "$REVIEW_DECISION" = "REVIEW_REQUIRED" ]; then
              # Status checks should be successful or not required
              if [ "$STATUS_CHECKS" = "SUCCESS" ] || [ "$STATUS_CHECKS" = "EXPECTED" ] || [ "$STATUS_CHECKS" = "PENDING" ]; then
                can_merge=true
              fi
            fi
          fi
          
          if [ "$can_merge" = "true" ]; then
            echo "✅ All conditions met - auto-merging PR #$PR_NUMBER"
            
            # Add auto-merge comment with detailed info
            gh pr comment $PR_NUMBER --body "🤖 **Auto-merging PR #$PR_NUMBER**

**Branch:** \`$HEAD_BRANCH\` → \`$BASE_BRANCH\`  
**Status:** All checks passed and PR ready for merge  
**Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

✅ **Merge Conditions Met:**
- PR is open and mergeable
- Review status: $REVIEW_DECISION
- Status checks: $STATUS_CHECKS
- Automated quality checks passed

🔄 **Merging with squash strategy...**"
            
            # Wait a moment for the comment to post
            sleep 2
            
            # Merge the PR with error handling
            if gh pr merge $PR_NUMBER --squash --delete-branch; then
              echo "✅ PR #$PR_NUMBER successfully merged and branch deleted"
              
              # Post success comment
              echo "🎉 **Merge Completed Successfully**

PR #$PR_NUMBER has been merged into \`$BASE_BRANCH\` and the feature branch \`$HEAD_BRANCH\` has been cleaned up.

Thank you for your contribution! 🚀" > merge_success.md
              
            else
              echo "❌ Failed to merge PR #$PR_NUMBER"
              
              # Post failure comment
              gh pr comment $PR_NUMBER --body "⚠️ **Auto-merge Failed**

The automatic merge of PR #$PR_NUMBER encountered an issue. This could be due to:
- Merge conflicts that developed since the last check
- Branch protection rules that weren't detected
- Temporary GitHub API issues

Please try merging manually or check the branch status."
              
              exit 1
            fi
          else
            echo "PR #$PR_NUMBER not ready for auto-merge"
            
            # Detailed feedback on why merge is not possible
            reasons=()
            if [ "$STATE" != "OPEN" ]; then
              reasons+=("PR is not open (current: $STATE)")
            fi
            if [ "$MERGEABLE" != "MERGEABLE" ]; then
              if [ "$MERGEABLE" = "CONFLICTING" ]; then
                reasons+=("PR has merge conflicts")
              else
                reasons+=("PR mergeable status: $MERGEABLE")
              fi
            fi
            if [ "$REVIEW_DECISION" = "CHANGES_REQUESTED" ]; then
              reasons+=("Changes requested in review")
            fi
            if [ "$STATUS_CHECKS" = "FAILURE" ]; then
              reasons+=("Status checks are failing")
            fi
            
            if [ ${#reasons[@]} -gt 0 ]; then
              echo "Reasons PR cannot be auto-merged:"
              printf '  - %s\n' "${reasons[@]}"
              
              # Only comment if there are specific issues to report
              if [ "$MERGEABLE" = "CONFLICTING" ] || [ "$REVIEW_DECISION" = "CHANGES_REQUESTED" ] || [ "$STATUS_CHECKS" = "FAILURE" ]; then
                comment_body="⏳ **Auto-merge on hold for PR #$PR_NUMBER**

The following conditions need to be resolved before auto-merge:
"
                for reason in "${reasons[@]}"; do
                  comment_body="${comment_body}
- $reason"
                done
                
                comment_body="${comment_body}

Once these conditions are met, the PR will be automatically merged. 🤖"
                
                gh pr comment $PR_NUMBER --body "$comment_body"
              fi
            fi
          fi