# CI — SUBJECT: the PR diff — lint, the test suites, and the npm audit gate. This is the merge gate.
# forge — this repo's own CI (self-inspect + both test suites + security).
# Consumer apps do NOT copy this; they call only the reusable
# code-inspection.yml gate from their existing CI (see README).

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual dispatch against any ref. Two uses, both real:
  #
  #   1. Re-run the gate against a branch without opening a PR.
  #   2. PROVE THE ALERT CAN GO RED. `alert-on-failure` fires on any non-PR
  #      event, so dispatching this against a branch with a deliberately broken
  #      test is the only way to exercise it end to end WITHOUT pushing a
  #      failing commit to master. forge's own standard requires it: "A monitor
  #      must be proven to go RED, not merely green today." A check that cannot
  #      fail is worse than no check — it reads as coverage.
  #
  # alate and loom already carry this hatch on their own gates.
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  # Self-inspect with the LOCAL CLI (advisory). We can't use the reusable
  # code-inspection.yml here — it installs the CLI from @master, which wouldn't
  # have this PR's code yet. Run the checked-out code directly.
  inspect:
    name: Code Inspection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Self-inspect (advisory)
        run: node standards-cli/cli/index.js inspect --standards security --path . || true

  # Lint + format, BLOCKING. Advisory until 2026-09-08, when the eslint rules
  # prettier also owns were removed from .eslintrc.js and the residual 25
  # errors were cleared (#108, #111) — before that the gate reported 1081
  # errors nobody could act on, so enforcing it would only have taught people
  # to bypass it.
  #
  # Both halves run: eslint for code quality, prettier for formatting. Checking
  # only eslint would leave formatting unenforced, because eslint-config-prettier
  # deliberately switches those rules off.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: ESLint + Prettier
        run: npm run lint:ci

  # All three test suites: standards-cli + rubric (each with its own 80% gate)
  # and the workflow-payload suite (prompt-builder behaviour + the parse check
  # for references/workflows/*.js, which nothing else covers).
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests (standards-cli + rubric + workflows)
        run: npm test

  # Security scanning. No CodeQL — code scanning requires GitHub Advanced
  # Security, unavailable on this private repo; npm audit + the standards
  # security self-inspect (inspect job) cover deps + secrets.
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # BLOCKING: runtime dependencies only. These are what actually ship when
      # someone installs the plugin, so a high-severity advisory here is a real
      # exposure and must stop the PR.
      - name: Run npm audit (runtime deps — blocking)
        run: npm audit --audit-level=high --omit=dev

      # ADVISORY: the full tree, dev tooling included. Reported, never blocking.
      #
      # This split exists because the unscoped gate went red on 2026-09-09 for
      # GHSA-2883-xcg3-v3hh in js-yaml, reachable only via eslint@8 and
      # jest@29 — build tooling that never ships. Neither has a non-major fix,
      # so the gate was failing every PR in the repo for something nobody could
      # act on. forge's own standard says a rule nobody can satisfy is not a
      # rule; `standards/security-triage.md` says classify runtime-vs-build-time
      # by dependency path, which is exactly what `--omit=dev` does.
      #
      # Keep this step. Build-time compromise is a genuine supply-chain risk
      # even when it does not ship, so dev advisories must stay VISIBLE — they
      # just must not block a docs PR on an unfixable transitive dev dep.
      - name: Run npm audit (full tree — advisory only)
        continue-on-error: true
        run: npm audit --audit-level=high

  # Failure alerting for the DEFAULT BRANCH only.
  #
  # Scoped to non-PR events on purpose. A red run on a PR is not silent — the
  # author is looking straight at it, and pr-gate-guard.yml covers the case
  # where no check ran at all. A red run on `master` after a merge has nobody
  # watching it, and that is the gap: a red run in the Actions tab is SILENT,
  # which is how alate's backend deploys sat dead for 18 days (2026-06-15 ->
  # 2026-07-03) while merges piled up unshipped.
  #
  # This ships ONLY to forge and litmus, the two repos whose ci.yml actually
  # has a `push:` trigger. The four app repos are `pull_request`-only, so an
  # alert there could never fire — and forge's own standard says a check that
  # cannot fail is worse than no check, because it reads as coverage. Their
  # real gap is that master is never tested at all; that needs a `push:`
  # trigger and a decision about CI load, not a dead alert job.
  alert-on-failure:
    name: Alert — red default branch
    needs: [inspect, lint, test, security]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # github-script, NOT `gh`. The CLI is ABSENT on the org's self-hosted
      # runners (probed 2026-07-26), so `gh issue create` would become a silent
      # `command not found` the moment this job moved off hosted — turning a
      # loud failure into no alert at all.
      - name: Open or append to the ci-failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = process.env.GITHUB_REF_NAME;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const titlePrefix = `CI failure: ${ref}`;

            // DEDUP — mandatory here, unlike the deploy alerters this borrows
            // its shape from. None of those dedupe, and alate's
            // supabase-migrations alerter has opened NINE issues that way
            // (#306, #309, #311, #312, #316, #318, #324, #331, #332). ci.yml
            // runs orders of magnitude more often than a deploy; undeduped it
            // is a spam cannon, and an alert channel nobody can read is the
            // same as no alert channel.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'ci-failure', per_page: 100,
            });
            const existing = open.find((i) => i.title.startsWith(titlePrefix));

            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Still red — ${runUrl}`,
              });
              core.info(`Appended to #${existing.number}; not duplicating.`);
              return;
            }

            await github.rest.issues.create({
              owner, repo,
              title: `${titlePrefix} (${new Date().toISOString().slice(0, 10)})`,
              // `bug` is REQUIRED, not decoration. crash-monitor's triage
              // filter is an ALLOWLIST — bug / build-failure / crash-monitor /
              // auto-generated / unlabelled. An issue labelled `ci-failure`
              // ALONE is not on that list and gets skipped by the very
              // automation meant to pick it up; mood-layer's APK alerter had
              // exactly that bug until 2026-09-09.
              labels: ['ci-failure', 'bug'],
              body: [
                `**CI is red on \`${ref}\`** — a non-PR run, so nothing else reports it.`,
                '',
                `Run: ${runUrl}`,
                '',
                'The default branch is failing its own gate. Anything merged after this point was gated against a build that no longer passes.',
                '',
                'Close this once CI is green again — the next failure opens a fresh issue.',
              ].join('\n'),
            });
            core.notice('Opened a ci-failure issue.');
